[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: 需要 CUDA GPU 的测试（CI 上跳过：pytest -m 'not gpu'）",
    "slow: 长耗时测试（模型加载 / 长稳压测 / 大 batch）",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", "__pycache__", "test", "models"]

[tool.ruff.lint]
# 先只启用"确定是错误"的规则（语法/未定义名），保证 CI 稳定；
# 团队规范类规则（I/UP/B 等）后续按需开启。
select = ["E9", "F"]
